<div class="post-card">
  <div class="post-header">
    <img class="avatar" [src]="post.userAvatarUrl" alt="avatar">
    <div class="header-text">
      <div class="user-name">{{ post.userName }}</div>
      <div class="post-date">{{ post.createdAt | date:'short' }}</div>
    </div>

    <button class="details-btn" (click)="openDetails()">Szczegóły</button>
  </div>

  <img class="post-img" [src]="post.photoUrl" [alt]="post.description" (click)="openDetails()">

  <div class="post-desc" (click)="openDetails()">
    {{ post.description }}
  </div>

  <div *ngIf="post.location" class="location" (click)="navigateToLocation(); $event.stopPropagation()">
    {{ post.location.name }} - <span class="link">Prowadź</span>
  </div>
</div>
